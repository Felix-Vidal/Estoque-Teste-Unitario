# Workflow só para demonstrar o uso de Secrets
name: Demonstração de Secret

# Roda apenas manualmente, pelo botão "Run workflow" na aba Actions
on:
  workflow_dispatch:

jobs:
  mostrar-secret:
    runs-on: ubuntu-latest

    steps:
      # Lê o valor cadastrado em Settings → Secrets and variables → Actions.
      # O GitHub esconde o valor no log: aparece "***" no lugar da senha
      - name: Mostrar o secret
        run: echo "A senha é ${{ secrets.MINHA_SENHA }}"